# Skimdit site configuration. Every key is documented in
# https://github.com/GTKottman/skimdit/blob/main/docs/CONFIG.md

[site]
title = "Deeper Thinking"
url = "https://deeperthinking.xyz"
language = "en"
timezone = "America/Chicago"

[author]
name = "Gerrod Kottman"

[robots]
ai = "allow"

[server]
push = true
trust_proxy = true

[comments]
enabled = true

[stats]
enabled = true

[newsletter]
enabled = true
from = "Deeper Thinking <letters@deeperthinking.xyz>"
smtp_host = "mail.kottmanconsulting.com"
smtp_port = 465
smtp_user = "letters@deeperthinking.xyz"
smtp_security = "tls"
bounce_imap = "mail.kottmanconsulting.com:993"
bounce_user = "letters@deeperthinking.xyz"

[fediverse]
enabled = false
